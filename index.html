<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login Page</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white">

  <div class="flex flex-col md:flex-row-reverse min-h-screen justify-center md:justify-normal md:h-screen md:p-6 md:gap-8">

    <img src="image.jpg"
         alt="Still life floral painting"
         class="w-full h-40 md:h-full md:w-1/2 object-cover rounded-2xl m-4 md:m-0" />

    <div class="flex-1 flex flex-col justify-center items-center px-8 md:pl-16 md:pr-8 overflow-y-auto">
      <div class="w-full max-w-sm">

        <h1 class="text-2xl font-bold text-gray-900 mb-2">Welcome Back 👋</h1>
        <p class="text-sm text-gray-500 mb-6">
          Today is a new day. It's your day. You shape it. Sign in to start managing your projects.
        </p>

        <form class="space-y-4">
          <div>
            <label class="block text-sm text-gray-700 mb-1">Email</label>
            <input type="email" placeholder="Example@email.com"
                   class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-800" />
          </div>

          <div>
            <label class="block text-sm text-gray-700 mb-1">Password</label>
            <input type="password" placeholder="At least 8 characters"
                   class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-800" />
          </div>

          <div class="text-right">
            <a href="#" class="text-sm text-gray-800 hover:underline">Forgot Password?</a>
          </div>

          <button type="submit"
                  class="w-full bg-gray-900 hover:bg-gray-800 text-white text-sm font-medium py-2.5 rounded-md transition">
            Sign in
          </button>
        </form>

        <div class="flex items-center my-5">
          <hr class="flex-grow border-gray-200" />
          <span class="px-3 text-xs text-gray-400 md:hidden">Or sign in with</span>
          <span class="px-3 text-xs text-gray-400 hidden md:inline">Or</span>
          <hr class="flex-grow border-gray-200" />
        </div>

        <div class="flex flex-row md:flex-col gap-3">
          <button class="flex-1 flex items-center justify-center gap-2 border border-gray-300 rounded-md py-2 text-sm hover:bg-gray-50 transition">
            <img src="google-color.svg" class="w-4 h-4" alt="Google" />
            <span class="md:hidden">Google</span>
            <span class="hidden md:inline">Sign in with Google</span>
          </button>
          <button class="flex-1 flex items-center justify-center gap-2 border border-gray-300 rounded-md py-2 text-sm hover:bg-gray-50 transition">
            <img src="facebook-color.svg" class="w-4 h-4" alt="Facebook" />
            <span class="md:hidden">Facebook</span>
            <span class="hidden md:inline">Sign in with Facebook</span>
          </button>
        </div>

        <p class="text-center text-sm text-gray-500 mt-6">
          Don't you have an account? <a href="#" class="text-gray-900 font-medium hover:underline">Sign up</a>
        </p>

        <p class="text-center text-xs text-gray-400 mt-4">© 2023 ALL RIGHTS RESERVED</p>

      </div>
    </div>

  </div>

</body>
</html>
